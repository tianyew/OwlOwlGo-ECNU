name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repository-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f code/frontend/package.json
          test -f code/backend/pyproject.toml
          test -f docs/mgmt/project-plan.md
          for directory in docs/requirements docs/algorithm docs/software docs/mgmt docs/retrospection code/backend code/frontend tests; do
            test -d "$directory"
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm cache requires a lockfile. Enable it after package-lock.json is committed.
      - name: Install dependencies when lockfile exists
        if: ${{ hashFiles('code/frontend/package-lock.json') != '' }}
        run: npm ci
      - name: Build frontend
        if: ${{ hashFiles('code/frontend/package-lock.json') != '' }}
        run: npm run build
      - name: Check placeholder project
        if: ${{ hashFiles('code/frontend/package-lock.json') == '' }}
        run: echo "Frontend dependencies have not been locked yet."

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: owlowlgo
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: owlowlgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owlowlgo -d owlowlgo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OWL_TEST_DATABASE_URL: postgresql+psycopg://owlowlgo:test-only-password@127.0.0.1:5432/owlowlgo_test
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m compileall app tests
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test backend including PostgreSQL
        run: python -m pytest -q

