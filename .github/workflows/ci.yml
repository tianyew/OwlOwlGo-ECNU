name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repository-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f frontend/package.json
          test -f backend/pyproject.toml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies when lockfile exists
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: npm ci
      - name: Check placeholder project
        if: ${{ hashFiles('frontend/package-lock.json') == '' }}
        run: echo "Frontend dependencies have not been locked yet."

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m compileall app tests

