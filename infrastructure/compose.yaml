services:
  frontend:
    build:
      context: ..
      dockerfile: infrastructure/docker/frontend.Dockerfile
    depends_on:
      - backend

  backend:
    build:
      context: ..
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file:
      - ../.env
      - ../code/backend/.env
    volumes:
      - account_data:/app/local-data

  database:
    profiles: ["database"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: owlowlgo
      POSTGRES_USER: owlowlgo
      POSTGRES_PASSWORD: owlowlgo
    volumes:
      - postgres_data:/var/lib/postgresql/data

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  account_data:
  postgres_data:

